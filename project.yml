name: ANY
options:
  bundleIdPrefix: com.lakphy
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ANY:
    type: application
    platform: macOS
    sources:
      - path: ANY
    info:
      path: ANY/Resources/Info.plist
      properties:
        CFBundleDisplayName: ANY
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: ANY 需要控制 Finder 与系统事件，以执行清空废纸篓、切换外观等系统命令。
        NSHumanReadableCopyright: Copyright © 2026 lakphy. All rights reserved.
    entitlements:
      path: ANY/Resources/ANY.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lakphy.any
        PRODUCT_NAME: ANY
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        # A stable signing identity keeps the Accessibility permission across rebuilds;
        # ad-hoc signatures change with every build and macOS drops the grant.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: Z262GH82B2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
